name: Bouw Teamspeak Heerlen PC EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "heerlen/**"
      - "assets/**"
      - "build_icon.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/windows-exe.yml"

permissions:
  contents: read

jobs:
  windows-exe:
    name: Windows 64-bit EXE bouwen
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Project ophalen
        uses: actions/checkout@v4
      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Pakketten installeren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.11,<7" "Pillow>=11,<13"
      - name: Unit tests uitvoeren
        run: python -m unittest discover -s tests -v
      - name: Windows-icoon genereren
        run: python build_icon.py
      - name: Windows EXE bouwen
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Teamspeak-Heerlen-PC" --icon "assets/heerlen.ico" --add-data "assets/logo.svg;assets" main.py
      - name: EXE controleren en checksum maken
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Teamspeak-Heerlen-PC.exe")) {
            throw "EXE ontbreekt."
          }
          $hash = (Get-FileHash "dist/Teamspeak-Heerlen-PC.exe" -Algorithm SHA256).Hash
          "$hash  Teamspeak-Heerlen-PC.exe" | Out-File -FilePath "dist/Teamspeak-Heerlen-PC.exe.sha256" -Encoding ascii
      - name: EXE aanbieden als download
        uses: actions/upload-artifact@v4
        with:
          name: Teamspeak-Heerlen-PC-Windows-EXE
          path: |
            dist/Teamspeak-Heerlen-PC.exe
            dist/Teamspeak-Heerlen-PC.exe.sha256
          if-no-files-found: error
          retention-days: 30
